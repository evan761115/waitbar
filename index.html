<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逸群 PRO | 深度終端 v2.1.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        :root { --p: #3b82f6; --bg: #020617; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: #f1f5f9; height: 100vh; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .scanline { width: 100%; height: 2px; background: var(--p); position: absolute; z-index: 100; box-shadow: 0 0 15px var(--p); animation: scan 4s linear infinite; display: none; }
        @keyframes scan { from { top: 0%; } to { top: 100%; } }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col">

    <nav class="h-20 border-b border-white/10 glass flex items-center justify-between px-10 shrink-0 z-50">
        <div class="flex items-center gap-6">
            <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center rotate-3"><i class="fas fa-terminal"></i></div>
            <div>
                <span class="font-black text-2xl tracking-tighter italic">ARTIST<span class="text-blue-500">INTEL</span> PRO</span>
                <span class="text-[9px] text-slate-500 font-bold tracking-[0.4em] block uppercase">Final Stability Node v2.1.7</span>
            </div>
        </div>
        <div class="relative">
            <input type="password" id="apiKey" placeholder="AUTHENTICATION KEY" class="bg-slate-900 border border-white/10 rounded-xl px-10 py-2.5 text-xs w-80 mono text-blue-400 focus:outline-none">
            <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-96 glass border-r border-white/5 flex flex-col p-8 shrink-0">
            <div class="flex-1 space-y-10">
                <section>
                    <label class="text-[10px] font-black text-slate-500 tracking-widest uppercase mb-4 block">Target Artist</label>
                    <input type="text" id="artistInput" placeholder="例如：費玉清" class="w-full bg-slate-950 border border-white/10 rounded-2xl px-6 py-5 text-xl font-bold text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </section>
            </div>
            <button onclick="executeInquiry()" class="w-full py-6 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black tracking-widest transition-all flex items-center justify-center gap-4 shadow-xl">
                <i class="fas fa-search-plus"></i> START ANALYSIS
            </button>
        </aside>

        <main class="flex-1 relative bg-[#010409] flex flex-col overflow-hidden">
            <div id="scanline" class="scanline"></div>
            <div id="loading" class="hidden absolute inset-0 bg-slate-950/95 z-[100] flex flex-col items-center justify-center">
                <div class="w-16 h-16 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-6"></div>
                <div id="statusLog" class="mono text-[11px] text-blue-400 tracking-widest">CONNECTING TO GOOGLE AI...</div>
            </div>

            <div class="h-14 border-b border-white/5 flex items-center px-10 gap-10 bg-slate-950/50">
                <button onclick="switchTab('basic')" class="tab-btn text-[10px] font-black tracking-widest uppercase border-b-2 border-blue-500 text-blue-500 h-full" data-tab="basic">基本資料</button>
                <button onclick="switchTab('career')" class="tab-btn text-[10px] font-black tracking-widest uppercase border-b-2 border-transparent text-slate-500 h-full" data-tab="career">演藝資歷</button>
            </div>

            <div class="flex-1 overflow-y-auto p-16">
                <div id="welcome" class="h-full flex flex-col items-center justify-center opacity-10">
                    <i class="fas fa-database text-[12rem] mb-6"></i>
                    <p class="text-2xl font-black">AWAITING SYSTEM DATA</p>
                </div>
                <div id="report" class="hidden space-y-10">
                    <div id="tab-basic" class="tab-content active">
                        <div class="glass p-12 rounded-[3rem] border-l-8 border-blue-500">
                            <h2 id="resTitle" class="text-4xl font-black mb-6 italic">分析報告</h2>
                            <div id="basicData" class="text-xl leading-relaxed text-slate-300 font-medium"></div>
                        </div>
                    </div>
                    <div id="tab-career" class="tab-content">
                        <div class="glass p-12 rounded-[3rem] border-l-8 border-indigo-500">
                            <div id="careerData" class="text-lg leading-loose text-slate-300 whitespace-pre-wrap"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('text-blue-500', 'border-blue-500');
                b.classList.add('text-slate-500', 'border-transparent');
            });
            document.getElementById('tab-'+t).classList.add('active');
            document.querySelector(`[data-tab="${t}"]`).classList.add('text-blue-500', 'border-blue-500');
        }

        async function executeInquiry() {
            const name = document.getElementById('artistInput').value;
            const key = document.getElementById('apiKey').value;
            const loader = document.getElementById('loading');
            const log = document.getElementById('statusLog');
            
            if(!name || !key) return alert("請輸入藝人名稱與 API Key。");

            loader.classList.remove('hidden');
            document.getElementById('scanline').style.display = 'block';

            // 最終極的模型路徑清單 (排除所有 exp 字樣，因為 exp 通常被個人帳號鎖定)
            const modelVariations = [
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,
                `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`,
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${key}`
            ];

            const prompt = `請針對藝人「${name}」產出深度演藝情資，包含：出道歷程、秀場或代表作品。內容請儘量詳盡。`;

            for (let url of modelVariations) {
                try {
                    log.innerText = `[RETRY] 正在嘗試連線節點...`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();
                    
                    if (data.candidates && data.candidates[0].content) {
                        const content = data.candidates[0].content.parts[0].text;
                        document.getElementById('basicData').innerText = content;
                        document.getElementById('careerData').innerText = content; // 先填充相同內容
                        document.getElementById('welcome').classList.add('hidden');
                        document.getElementById('report').classList.remove('hidden');
                        loader.classList.add('hidden');
                        document.getElementById('scanline').style.display = 'none';
                        return; // 成功即退出
                    } else if (data.error) {
                        console.warn(`節點失敗: ${url}`, data.error.message);
                        if (data.error.code === 403) {
                            alert("關鍵錯誤 (403): 你的 Key 沒有啟用 Generative Language API 權限，請去 Google AI Studio 檢查。");
                            break;
                        }
                    }
                } catch (e) { console.error("系統故障", e); }
            }

            alert("所有連線節點均失效 (404/403)。這通常意味著 API Key 已失效或該模型路徑對你的帳號不開放。");
            loader.classList.add('hidden');
            document.getElementById('scanline').style.display = 'none';
        }
    </script>
</body>
</html>
