<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝人資料系統 | 專業建檔版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0b0f1a; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .report-content h2 { color: #3b82f6; font-size: 1.5rem; font-weight: bold; margin: 1.5rem 0 0.5rem; border-bottom: 1px solid #1e293b; }
        .report-content p { margin-bottom: 1rem; line-height: 1.8; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <nav class="h-16 border-b border-slate-800 glass flex items-center justify-between px-8 z-20">
        <div class="flex items-center gap-3">
            <span class="font-black text-xl tracking-tighter text-white underline decoration-blue-500">ARTIST INTEL</span>
        </div>
        <div class="flex items-center gap-4">
            <input type="password" id="apiKey" placeholder="貼上你的 Gemini API Key" class="bg-slate-900 border border-slate-700 rounded px-3 py-1 text-xs text-white focus:border-blue-500 outline-none w-64">
        </div>
    </nav>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-80 border-r border-slate-800 bg-[#0f172a] p-6 flex flex-col gap-6">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">目標藝人</label>
                <input type="text" id="artistInput" placeholder="如：胡瓜" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <button onclick="fetchData()" id="searchBtn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                發動 AI 深度檢索
            </button>
        </aside>

        <section class="flex-1 bg-slate-950 p-8 overflow-y-auto">
            <div id="loadingArea" class="hidden h-full flex flex-col items-center justify-center">
                <div class="loader mb-4"></div>
                <p class="text-blue-400 font-bold animate-pulse text-sm">正在調度 Google 搜尋與 AI 分析中...</p>
            </div>

            <div id="reportContainer" class="hidden max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="reportTitle" class="text-3xl font-black text-white"></h2>
                    <button onclick="window.print()" class="text-xs bg-slate-800 text-slate-300 px-4 py-2 rounded-lg hover:bg-slate-700">導出檔案</button>
                </div>
                <div class="glass p-10 rounded-3xl shadow-2xl">
                    <div id="reportContent" class="report-content text-slate-300"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        async function fetchData() {
            const name = document.getElementById('artistInput').value;
            const key = document.getElementById('apiKey').value;
            if (!name || !key) return alert("請填寫姓名與 API Key");

            document.getElementById('loadingArea').classList.remove('hidden');
            document.getElementById('reportContainer').classList.add('hidden');

            // 這是針對 v1beta 搜尋功能優化的 Prompt 與 JSON 結構
            const payload = {
                contents: [{
                    parts: [{
                        text: `你現在是專業演藝調查員。請針對「${name}」搜尋並整理：1.基本資料 2.資歷(特別是演唱會、民歌50、藍寶石等秀場) 3.演出費用預估(參考標案新聞) 4.近期新聞標題與爭議。語氣要專業直白，使用繁體中文。`
                    }]
                }],
                // 關鍵：開啟 Google Search 工具
                tools: [{ google_search_retrieval: {} }]
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(`Google API 報錯: ${data.error.message} (代碼: ${data.error.code})`);
                }

                const resultText = data.candidates[0].content.parts[0].text;
                
                // 簡單處理 Markdown 換行
                const htmlContent = resultText.replace(/\n/g, '<br>').replace(/## (.*)/g, '<h2>$1</h2>');
                
                document.getElementById('reportTitle').innerText = `${name} 深度情資報告`;
                document.getElementById('reportContent').innerHTML = htmlContent;
                document.getElementById('loadingArea').classList.add('hidden');
                document.getElementById('reportContainer').classList.remove('hidden');

            } catch (error) {
                document.getElementById('loadingArea').classList.add('hidden');
                alert(error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
