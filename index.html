<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝人情資系統 | 專業建檔版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #0b0f1a; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .report-content h1, .report-content h2 { color: #3b82f6; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 5px; }
        .report-content p { margin-bottom: 1rem; line-height: 1.8; }
        .report-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animate: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <nav class="h-16 border-b border-slate-800 glass flex items-center justify-between px-8 z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-lg flex items-center justify-center shadow-lg">
                <i class="fas fa-bolt text-white text-xl"></i>
            </div>
            <span class="font-black text-xl tracking-tighter italic text-white">ARTIST<span class="text-blue-500">INTEL</span></span>
        </div>
        <div class="flex items-center gap-4">
            <input type="password" id="apiKey" placeholder="在此輸入 Gemini API Key" 
                   class="bg-slate-900 border border-slate-700 rounded px-3 py-1 text-xs focus:outline-none focus:border-blue-500 w-48">
            <button class="text-sm font-medium text-slate-400 hover:text-white transition">預覽模式</button>
            <button class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-full text-sm font-bold transition shadow-lg shadow-blue-900/40">專業版</button>
        </div>
    </nav>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-80 border-r border-slate-800 bg-[#0f172a] p-6 flex flex-col gap-6 overflow-y-auto">
            <section>
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-3">搜尋目標</label>
                <input type="text" id="artistInput" placeholder="輸入姓名 (如：胡瓜)" 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-600 outline-none transition placeholder:text-slate-700">
            </section>

            <section>
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-3">檢索維度</label>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-800">
                        <span class="text-sm">歷史秀場經驗</span>
                        <i class="fas fa-check-circle text-blue-500 text-xs"></i>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-800">
                        <span class="text-sm">商演報價估算</span>
                        <i class="fas fa-check-circle text-blue-500 text-xs"></i>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-800">
                        <span class="text-sm">社會爭議事件</span>
                        <i class="fas fa-check-circle text-blue-500 text-xs"></i>
                    </div>
                </div>
            </section>

            <button onclick="fetchArtistData()" id="searchBtn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black text-lg shadow-2xl shadow-blue-900/20 transition-all active:scale-95">
                發動 AI 深度檢索
            </button>

            <div class="mt-auto p-4 bg-blue-900/10 border border-blue-900/30 rounded-xl">
                <p class="text-[11px] text-blue-400/80 leading-relaxed italic">
                    <i class="fas fa-shield-halved mr-1"></i> 成長助手提醒：此系統將針對 Google 熱搜及標案實情進行掃描，結果可能極其直白。
                </p>
            </div>
        </aside>

        <section class="flex-1 bg-slate-950 p-8 overflow-y-auto flex flex-col items-center">
            <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-slate-700">
                <i class="fas fa-fingerprint text-6xl mb-4 opacity-20"></i>
                <p class="text-xl font-medium">等待檢索指令...</p>
            </div>

            <div id="loadingArea" class="hidden h-full flex flex-col items-center justify-center">
                <div class="loader mb-4"></div>
                <p class="animate-pulse text-blue-400 font-bold tracking-widest">全網情資掃描中...</p>
            </div>

            <div id="reportContainer" class="hidden w-full max-w-4xl space-y-6">
                <div class="flex justify-between items-end">
                    <h2 id="reportTitle" class="text-4xl font-black text-white">檢索報告</h2>
                    <div class="flex gap-2">
                        <button onclick="alert('已模擬上傳 Google Drive')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition">
                            <i class="fas fa-cloud-arrow-up mr-2"></i>一鍵上傳雲端
                        </button>
                    </div>
                </div>
                
                <div class="glass p-10 rounded-3xl shadow-2xl">
                    <div id="reportContent" class="report-content text-slate-300">
                        </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        async function fetchArtistData() {
            const artistName = document.getElementById('artistInput').value;
            const apiKey = document.getElementById('apiKey').value;
            
            if (!artistName) return alert("請輸入藝人姓名");
            if (!apiKey) return alert("請輸入 Gemini API Key");

            // UI 狀態切換
            document.getElementById('welcomeMessage').classList.add('hidden');
            document.getElementById('reportContainer').classList.add('hidden');
            document.getElementById('loadingArea').classList.remove('hidden');

            const prompt = `你現在是專業演藝經紀與情資調查員。請針對「${artistName}」搜尋並整理以下資訊，語氣必須直白、不討好、針對實情：
            1. 基本資料：年齡、演藝類別。
            2. 表演資歷：特別列出個人演唱會、拼盤演出、民歌50、以及「早期秀場（如藍寶石、歌舞廳）」經歷。
            3. 演出費用：搜尋近期政府採購標案、跨年晚會新聞或商演行情，給出具體預估區間。
            4. 輿情監測：整理近期新聞標題，以及「曾經的重大爭議事件或負面新聞」。
            請用 Markdown 格式回傳繁體中文。`;

            try {
                // 使用 v1beta 版本的 API 以支援搜尋功能
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                
                // 簡單的 Markdown 轉 HTML (基本處理)
                const formattedText = rawText
                    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                    .replace(/^\* (.*$)/gim, '<li>$1</li>')
                    .replace(/\n/gim, '<br>');

                document.getElementById('reportTitle').innerText = `${artistName} 調查報告`;
                document.getElementById('reportContent').innerHTML = formattedText;
                
                document.getElementById('loadingArea').classList.add('hidden');
                document.getElementById('reportContainer').classList.remove('hidden');

            } catch (error) {
                alert("API 請求失敗，請確認 Key 是否有效。");
                console.error(error);
                document.getElementById('loadingArea').classList.add('hidden');
                document.getElementById('welcomeMessage').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
